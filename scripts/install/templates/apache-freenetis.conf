# Apache vhost pro FreenetIS Laravel.
# Šablona — placeholdery {{DOMAIN}} doplní configure script.
# certbot --apache po prvním běhu zduplikuje obsah do 443 vhostu se SSL.

<VirtualHost *:80>
    ServerName {{DOMAIN}}
    DocumentRoot /var/www/html/freenetis-laravel/public

    # /freenetis/* je hlavní URL prefix aplikace
    Alias /freenetis /var/www/html/freenetis-laravel/public

    <Directory /var/www/html/freenetis-laravel/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
        # Explicitní DirectoryIndex — bez něj Apache vrací 405 na /freenetis/
        # (po loginu Laravel redirectuje na route('dashboard') = /freenetis/).
        DirectoryIndex index.php
    </Directory>

    RewriteEngine On

    # Web Interface API endpointy (machine-to-machine, MikroTik QoS skripty atd.)
    # nesmí být přesměrované na HTTPS — klienti volají přes IP adresu, na kterou
    # nemá LetsEncrypt platný certifikát ("DNS spadne → MikroTik umře"). Endpointy
    # jsou IP-whitelist v guardTrusted() v controlleru, takže HTTP je bezpečné.
    # [END] zastaví zpracování všech dalších rewriterules (vč. certbot HTTPS redirectu),
    # což je přesně co potřebujeme — bez něj by certbot redirect po této rule pořád proběhl.
    RewriteCond %{REQUEST_URI} ^/freenetis/(web-interface|web_interface)/ [NC]
    RewriteRule .* - [END]

    # Holý kořen → /freenetis (uživatel napsal: "kdo přijde na X.X.X.X, jde na /freenetis")
    RewriteCond %{REQUEST_URI} ^/$
    RewriteRule ^/$ /freenetis/ [R=302,L]

    # PHP přes php-fpm socket. enablereuse + timeout 1800 — kvůli setup wizardu,
    # který může na velkém dumpu (1+ GB) běžet desítky minut.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/{{PHP_FPM_SOCK}}|fcgi://localhost"
    </FilesMatch>
    Timeout 1800
    ProxyTimeout 1800

    ErrorLog ${APACHE_LOG_DIR}/freenetis-error.log
    CustomLog ${APACHE_LOG_DIR}/freenetis-access.log combined
</VirtualHost>
